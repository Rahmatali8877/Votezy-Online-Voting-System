spring.application.name=Votezy
server.port=8081

# Database (set DB_PASSWORD as an environment variable; never commit your real password)
spring.datasource.url=jdbc:mysql://localhost:3306/votezy_db
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Session cookie: blocks cross-site requests (CSRF protection for session login)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# First admin account, created automatically at startup if it does not exist.
# Change these (use environment variables) before using the app for real.

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect